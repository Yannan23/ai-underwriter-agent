<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240" role="img" aria-labelledby="title desc">
  <title id="title">Prism AI Underwriter — Minimal Interview Architecture</title>
  <desc id="desc">A concise production architecture showing users, a generic frontend, identity and API entry, the core API, durable asynchronous underwriting, controlled AI analysis, deterministic decisions, human review, binding, persistent data, and cross-cutting production controls.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#172033" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#68758A"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#246BFD"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 750; letter-spacing: -0.4px; }
      .subtitle { font-size: 15px; fill: #667085; }
      .section { font-size: 12px; font-weight: 750; letter-spacing: 1.2px; fill: #667085; }
      .node-title { font-size: 17px; font-weight: 720; }
      .node-copy { font-size: 13px; fill: #536174; }
      .small-title { font-size: 15px; font-weight: 700; }
      .small-copy { font-size: 12px; fill: #536174; }
      .edge-label { font-size: 11px; font-weight: 650; fill: #667085; }
      .badge-text { font-size: 11px; font-weight: 750; fill: #FFFFFF; text-anchor: middle; dominant-baseline: middle; }
      .box { fill: #FFFFFF; stroke: #C9D2E3; stroke-width: 1.5; rx: 14; filter: url(#shadow); }
      .blue { fill: #EEF4FF; stroke: #5790FF; }
      .green { fill: #EBF9F3; stroke: #4AB58D; }
      .amber { fill: #FFF7E7; stroke: #DBA343; }
      .purple { fill: #F5F0FF; stroke: #9B7BE8; }
      .rose { fill: #FFF0F5; stroke: #DF6C98; }
      .slate { fill: #F7F9FC; stroke: #B6C1D2; }
      .main-line { fill: none; stroke: #68758A; stroke-width: 2; marker-end: url(#arrow); }
      .primary-line { fill: none; stroke: #246BFD; stroke-width: 2.4; marker-end: url(#arrowBlue); }
      .support-line { fill: none; stroke: #8C98AA; stroke-width: 1.7; stroke-dasharray: 6 6; marker-end: url(#arrow); }
      .join-line { fill: none; stroke: #9AA6B8; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1600" height="1240" fill="#F7F9FC"/>

  <text x="56" y="57" class="title">Prism AI Underwriter — Minimal Interview Architecture</text>
  <text x="56" y="84" class="subtitle">Core business flow, trust boundaries and production guarantees</text>

  <g transform="translate(1170 45)">
    <circle cx="0" cy="0" r="5" fill="#246BFD"/><text x="12" y="5" class="small-copy">request / command</text>
    <circle cx="150" cy="0" r="5" fill="#8C98AA"/><text x="162" y="5" class="small-copy">async / supporting flow</text>
  </g>

  <rect x="40" y="115" width="1520" height="850" rx="22" fill="#FFFFFF" stroke="#D8DFEA" stroke-width="1.5"/>
  <text x="66" y="146" class="section">SYSTEM BOUNDARY</text>

  <!-- Entry path -->
  <g aria-label="Users">
    <rect x="70" y="185" width="170" height="128" class="box slate"/>
    <circle cx="100" cy="217" r="14" fill="#475467"/>
    <text x="100" y="217" class="badge-text">1</text>
    <text x="124" y="222" class="node-title">Users</text>
    <text x="98" y="254" class="node-copy">Broker</text>
    <text x="98" y="276" class="node-copy">Underwriter / Approver</text>
    <text x="98" y="298" class="node-copy">Product / Risk Admin</text>
  </g>

  <g aria-label="Generic frontend">
    <rect x="285" y="185" width="180" height="128" class="box blue"/>
    <circle cx="315" cy="217" r="14" fill="#246BFD"/>
    <text x="315" y="217" class="badge-text">2</text>
    <text x="339" y="222" class="node-title">FE</text>
    <text x="313" y="254" class="node-copy">Web application</text>
    <text x="313" y="276" class="node-copy">REST · upload · realtime</text>
    <text x="313" y="298" class="node-copy">No business authority</text>
  </g>

  <g aria-label="Edge and identity">
    <rect x="510" y="185" width="210" height="128" class="box blue"/>
    <text x="538" y="222" class="node-title">Edge + Identity</text>
    <text x="538" y="254" class="node-copy">CDN / WAF / API Gateway</text>
    <text x="538" y="276" class="node-copy">OAuth/OIDC · JWT</text>
    <text x="538" y="298" class="node-copy">Tenant + role context</text>
  </g>

  <g aria-label="Core API">
    <rect x="770" y="165" width="300" height="168" class="box green"/>
    <circle cx="804" cy="201" r="14" fill="#138A65"/>
    <text x="804" y="201" class="badge-text">3</text>
    <text x="830" y="206" class="node-title">Core API</text>
    <text x="800" y="240" class="node-copy">TypeScript modular monolith</text>
    <text x="800" y="264" class="node-copy">AuthZ · validation · domain policies</text>
    <text x="800" y="288" class="node-copy">Idempotency / optimistic concurrency</text>
    <text x="800" y="312" class="node-copy">Transaction + outbox commit</text>
  </g>

  <path d="M240 249 H285" class="primary-line"/>
  <path d="M465 249 H510" class="primary-line"/>
  <path d="M720 249 H770" class="primary-line"/>

  <!-- Persistent data -->
  <g aria-label="Persistent data and approved knowledge">
    <rect x="1120" y="165" width="400" height="325" rx="18" fill="#FBFAFF" stroke="#B7A4E8" stroke-width="1.5"/>
    <text x="1148" y="198" class="section" fill="#7451D6">PERSISTENT DATA &amp; KNOWLEDGE</text>

    <rect x="1145" y="220" width="350" height="68" class="box purple" filter="none"/>
    <text x="1170" y="248" class="small-title">Aurora PostgreSQL</text>
    <text x="1170" y="270" class="small-copy">Business source of truth · immutable versions</text>

    <rect x="1145" y="306" width="350" height="68" class="box purple" filter="none"/>
    <text x="1170" y="334" class="small-title">S3 document security domains</text>
    <text x="1170" y="356" class="small-copy">Quarantine · originals · derived artifacts</text>

    <rect x="1145" y="392" width="350" height="68" class="box purple" filter="none"/>
    <text x="1170" y="420" class="small-title">OpenSearch approved KB index</text>
    <text x="1170" y="442" class="small-copy">Versioned release · tenant/product metadata filter</text>

    <text x="1148" y="479" class="edge-label">Encrypted, tenant-scoped; indexes are rebuildable</text>
  </g>

  <path d="M1070 225 H1093 Q1105 225 1105 237 V254 H1145" class="support-line"/>
  <text x="1080" y="213" class="edge-label">facts / versions</text>

  <!-- Durable orchestration -->
  <g aria-label="Durable orchestration">
    <rect x="570" y="378" width="500" height="116" class="box amber"/>
    <circle cx="604" cy="412" r="14" fill="#B56A00"/>
    <text x="604" y="412" class="badge-text">4</text>
    <text x="630" y="417" class="node-title">Durable Orchestration</text>
    <text x="600" y="450" class="node-copy">EventBridge → Step Functions → workload SQS / DLQ</text>
    <text x="600" y="475" class="node-copy">Versioned workflow · retries · timeout · callback · checkpoint</text>
  </g>
  <path d="M920 333 V378" class="primary-line"/>
  <text x="935" y="358" class="edge-label">immutable submission / evaluation ID</text>

  <!-- Parallel workers -->
  <text x="70" y="538" class="section">BOUNDED PARALLEL ANALYSIS</text>

  <g aria-label="Document processing">
    <rect x="90" y="560" width="250" height="116" class="box amber"/>
    <text x="116" y="594" class="small-title">Document Processing</text>
    <text x="116" y="620" class="small-copy">scan · OCR · normalize</text>
    <text x="116" y="643" class="small-copy">evidence + conflicts + completeness</text>
    <text x="116" y="663" class="edge-label">persist result, then callback</text>
  </g>

  <g aria-label="External checks">
    <rect x="370" y="560" width="230" height="116" class="box amber"/>
    <text x="396" y="594" class="small-title">External Checks</text>
    <text x="396" y="620" class="small-copy">registry · claims · compliance</text>
    <text x="396" y="643" class="small-copy">provider-specific isolation</text>
    <text x="396" y="663" class="edge-label">timeouts + circuit breakers</text>
  </g>

  <g aria-label="Controlled AI underwriter">
    <rect x="630" y="540" width="300" height="156" class="box rose"/>
    <circle cx="664" cy="574" r="14" fill="#C23B73"/>
    <text x="664" y="574" class="badge-text">5</text>
    <text x="690" y="579" class="small-title">Controlled AI Underwriter</text>
    <text x="660" y="611" class="small-copy">Read-only, tenant-scoped evidence tools</text>
    <text x="660" y="634" class="small-copy">Pinned model · prompt · KB release</text>
    <text x="660" y="657" class="small-copy">RAG citations · schema · safety validation</text>
    <rect x="660" y="670" width="240" height="18" rx="9" fill="#C23B73"/>
    <text x="780" y="680" class="badge-text">ADVISORY — NEVER FINAL AUTHORITY</text>
  </g>

  <g aria-label="Rules pricing and authority">
    <rect x="960" y="560" width="250" height="116" class="box green"/>
    <text x="986" y="594" class="small-title">Rules + Pricing</text>
    <text x="986" y="620" class="small-copy">versioned eligibility policy</text>
    <text x="986" y="643" class="small-copy">deterministic premium + authority</text>
    <text x="986" y="663" class="edge-label">same pinned release manifest</text>
  </g>

  <g aria-label="Approved external services">
    <rect x="1240" y="540" width="260" height="156" class="box slate"/>
    <text x="1266" y="574" class="small-title">Approved Services</text>
    <text x="1266" y="603" class="small-copy">Bedrock models</text>
    <text x="1266" y="626" class="small-copy">Registry / claims / compliance</text>
    <text x="1266" y="649" class="small-copy">Policy Administration System</text>
    <text x="1266" y="678" class="edge-label">controlled egress + allowlists</text>
  </g>

  <!-- Fan out from orchestration -->
  <path d="M820 494 V520 H215 V560" class="join-line"/>
  <path d="M820 520 H485 V560" class="join-line"/>
  <path d="M820 494 V540" class="main-line"/>
  <path d="M820 520 H1085 V560" class="join-line"/>
  <path d="M215 545 V560" class="main-line"/>
  <path d="M485 545 V560" class="main-line"/>
  <path d="M1085 545 V560" class="main-line"/>

  <path d="M780 540 V515 H1320 V490" class="support-line"/>

  <!-- Deterministic decision and outcomes -->
  <g aria-label="Deterministic decision gate">
    <rect x="500" y="738" width="600" height="82" class="box green"/>
    <circle cx="536" cy="779" r="15" fill="#138A65"/>
    <text x="536" y="779" class="badge-text">6</text>
    <text x="565" y="770" class="node-title">Deterministic Decision + Authority Gate</text>
    <text x="565" y="795" class="node-copy">joins typed results; AI cannot approve, price or bind</text>
  </g>

  <path d="M215 676 V710 H800" class="join-line"/>
  <path d="M485 676 V710" class="join-line"/>
  <path d="M780 696 V710" class="join-line"/>
  <path d="M1085 676 V710 H800" class="join-line"/>
  <path d="M800 710 V738" class="primary-line"/>

  <rect x="210" y="865" width="240" height="68" class="box blue"/>
  <text x="330" y="893" text-anchor="middle" class="small-title">AUTO_QUOTE</text>
  <text x="330" y="916" text-anchor="middle" class="small-copy">only when every gate passes</text>

  <rect x="485" y="865" width="260" height="68" class="box amber"/>
  <text x="615" y="893" text-anchor="middle" class="small-title">HUMAN REVIEW</text>
  <text x="615" y="916" text-anchor="middle" class="small-copy">override reason + maker-checker</text>

  <rect x="780" y="865" width="240" height="68" class="box amber"/>
  <text x="900" y="893" text-anchor="middle" class="small-title">RFI / HOLD</text>
  <text x="900" y="916" text-anchor="middle" class="small-copy">new info → new immutable version</text>

  <g aria-label="Quote acceptance and policy binding">
    <rect x="1080" y="845" width="420" height="98" class="box blue"/>
    <text x="1108" y="878" class="small-title">Exact Quote Acceptance → Binding Workflow</text>
    <text x="1108" y="903" class="small-copy">idempotent PAS request · reconcile unknown outcome</text>
    <text x="1108" y="926" class="edge-label">Binding is separate from underwriting evaluation</text>
  </g>

  <path d="M680 820 V842 H330 V865" class="main-line"/>
  <path d="M800 820 V842 H615 V865" class="main-line"/>
  <path d="M920 820 V842 H900 V865" class="main-line"/>
  <path d="M330 933 V949 H1050 V882 H1080" class="primary-line"/>
  <path d="M615 933 V957 H1060 V914 H1080" class="primary-line"/>
  <path d="M1500 895 H1520 V666 H1500" class="support-line"/>

  <!-- Interview anchors -->
  <rect x="40" y="995" width="1520" height="200" rx="22" fill="#172033"/>
  <text x="66" y="1030" class="section" style="fill:#AEB9CA">INTERVIEW ANCHORS — THE DESIGN DECISIONS TO EXPLAIN</text>

  <g transform="translate(70 1056)">
    <circle cx="16" cy="17" r="16" fill="#246BFD"/><text x="16" y="17" class="badge-text">1</text>
    <text x="44" y="15" class="small-title" style="fill:#FFFFFF">Immutable business versions</text>
    <text x="44" y="38" class="small-copy" style="fill:#C5CEDB">Submission, evidence, AI result, quote</text>
    <text x="44" y="58" class="small-copy" style="fill:#C5CEDB">and acceptance remain reproducible.</text>
  </g>

  <g transform="translate(430 1056)">
    <circle cx="16" cy="17" r="16" fill="#B56A00"/><text x="16" y="17" class="badge-text">2</text>
    <text x="44" y="15" class="small-title" style="fill:#FFFFFF">Reliable async work</text>
    <text x="44" y="38" class="small-copy" style="fill:#C5CEDB">Outbox + idempotency + DLQ +</text>
    <text x="44" y="58" class="small-copy" style="fill:#C5CEDB">checkpointed workflows; no dual write.</text>
  </g>

  <g transform="translate(770 1056)">
    <circle cx="16" cy="17" r="16" fill="#C23B73"/><text x="16" y="17" class="badge-text">3</text>
    <text x="44" y="15" class="small-title" style="fill:#FFFFFF">AI is bounded evidence analysis</text>
    <text x="44" y="38" class="small-copy" style="fill:#C5CEDB">Pinned releases, read-only tools, citations,</text>
    <text x="44" y="58" class="small-copy" style="fill:#C5CEDB">guardrails and structured validation.</text>
  </g>

  <g transform="translate(1150 1056)">
    <circle cx="16" cy="17" r="16" fill="#138A65"/><text x="16" y="17" class="badge-text">4</text>
    <text x="44" y="15" class="small-title" style="fill:#FFFFFF">Production controls</text>
    <text x="44" y="38" class="small-copy" style="fill:#C5CEDB">Least privilege · KMS · audit · telemetry</text>
    <text x="44" y="58" class="small-copy" style="fill:#C5CEDB">Multi-AZ + warm standby (RPO≤5m/RTO≤1h).</text>
  </g>

  <line x1="70" y1="1145" x2="1530" y2="1145" stroke="#344054"/>
  <text x="70" y="1175" class="small-copy" style="fill:#9EABBD">Key trade-off:</text>
  <text x="165" y="1175" class="small-copy" style="fill:#E6EAF0">a modular monolith keeps transactional business invariants together; managed workflows isolate slow and failure-prone work.</text>
</svg>
