name: Dependency Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review Dependency Changes
    if: github.event.repository.visibility == 'public' || vars.GHAS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: never
          fail-on-severity: high

  required-gate:
    name: Dependency Review Gate
    if: always()
    needs: [review]
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Explain an unavailable private-repository review
        if: needs.review.result == 'skipped'
        run: |
          echo 'Dependency Review requires a public repository or GitHub Advanced Security.'
          echo 'For a private repository, enable GHAS and set GHAS_ENABLED=true.'
      - name: Require an attempted review to pass
        if: needs.review.result != 'success' && needs.review.result != 'skipped'
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
        run: |
          echo "Dependency Review ended with: $REVIEW_RESULT"
          exit 1
